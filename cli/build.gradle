plugins {
    id "application"
    alias libs.plugins.coordinatekit.third.party.licenses
}

dependencies {
    implementation project(":annotator")
    implementation project(":core")
    // Bundled so the distribution loads MALLET models out of the box. Kept as a separate jar in the
    // distribution's lib/ (no fat jar) to preserve the LGPL relink right of mallet's transitive tree.
    implementation project(":mallet")

    implementation libs.picocli
    implementation libs.jline
    implementation libs.coordinatekit.cli.brand
    implementation libs.coordinatekit.concordance

    annotationProcessor libs.picocli.codegen

    testImplementation libs.jackson.databind
}

// picocli reads the command classes reflectively, so a native image needs them registered.
// picocli-codegen writes reflect-config.json and proxy-config.json into the class output, from where
// they land in the jar; they are build outputs and are not committed. Resource metadata is not
// generated: the banner art is read through Class.getResourceAsStream, not declared as a picocli
// resource bundle, so the processor cannot infer it, and it is committed by hand instead (see
// src/main/resources/META-INF/native-image and ResourceMetadataTest).
// -Aproject is relative to the processor's own META-INF/native-image/picocli-generated/ base, so the
// files end up under picocli-generated/org.coordinatekit.crf/cli/. native-image searches every
// subdirectory of META-INF/native-image, so that extra segment costs nothing.
tasks.named("compileJava") {
    options.compilerArgs += ["-Aproject=org.coordinatekit.crf/cli"]
}

application {
    mainClass = "org.coordinatekit.crf.cli.CrfLauncher"
    applicationName = "crf"            // -> bin/crf, bin/crf.bat, CRF_OPTS
}

distributions {
    main {
        distributionBaseName = "crf"   // -> crf-<version>.zip / .tar, build/install/crf
    }
}

thirdPartyLicenses {
    licenses {
        register('Apache License, Version 2.0') { text = file('licenses/Apache-2.0.txt') }
        register('Common Public License, Version 1.0') {
            text = file('licenses/CPL-1.0.txt')
            reciprocalLabel = 'the Common Public License'
        }
        register('GNU Lesser General Public License, Version 2.1') {
            text = file('licenses/LGPL-2.1.txt')
            reciprocalLabel = 'the GNU Lesser General Public License'
        }
        register('GNU Lesser General Public License, Version 3.0') {
            text = file('licenses/LGPL-3.0.txt')
            reciprocalLabel = 'the GNU Lesser General Public License'
        }
        register('MIT License') { text = file('licenses/MIT.txt') }
        register('The 2-Clause BSD License') { text = file('licenses/BSD-2-Clause.txt') }
        register('The 3-Clause BSD License') { text = file('licenses/BSD-3-Clause.txt') }
    }
}

// Ship the project's own license at the archive root.
distributions.main.contents.from(rootProject.file("LICENSE.txt"))

startScripts {
    doLast {
        def unixDone = false
        unixScript.text = unixScript.text.replaceAll(~'(?m)^CLASSPATH=(.*)$') { match, cp ->
            unixDone = true; 'CLASSPATH=' + cp + ':$APP_HOME/ext/*'
        }
        assert unixDone : "CLASSPATH= line not found in generated unix start script (Gradle template changed)"

        def winDone = false
        windowsScript.text = windowsScript.text.replaceAll(~'(?m)^set CLASSPATH=(.*)$') { match, cp ->
            winDone = true; 'set CLASSPATH=' + cp + ';%APP_HOME%\\ext\\*'
        }
        assert winDone : "set CLASSPATH= line not found in generated windows start script (Gradle template changed)"
    }
}

jar {
    manifest {
        attributes(
                "Implementation-Title": "crf",
                "Implementation-Version": project.version
        )
    }
}
