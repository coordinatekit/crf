[versions]
# api — update conservatively (security/bugs only)
jspecify = "1.0.0"
picocli = "4.7.7"

# implementation — keep current
coordinatekit-foundation = "0.3.0"
jline = "4.4.8"
mallet = "2.0.8"
slf4j = "2.0.20"

# test — always latest
jackson = "3.2.4"
junit = "6.1.3"
logback = "1.6.5"

# build — keep current
errorprone = "2.50.0"
nullaway = "0.14.3"

# plugins
errorprone-plugin = "5.1.1"
graalvm-native = "1.1.18"
sonatype-central-portal-publisher = "1.2.4"
spotless = "8.11.0"

[libraries]
coordinatekit-cli-brand = { module = "org.coordinatekit.foundation:cli-brand", version.ref = "coordinatekit-foundation" }
coordinatekit-concordance = { module = "org.coordinatekit.foundation:concordance", version.ref = "coordinatekit-foundation" }
coordinatekit-conventions = { module = "org.coordinatekit.foundation:conventions", version.ref = "coordinatekit-foundation" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jline = { module = "org.jline:jline", version.ref = "jline" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mallet = { module = "cc.mallet:mallet", version.ref = "mallet" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[plugins]
coordinatekit-aggregate-javadoc = { id = "org.coordinatekit.foundation.aggregate-javadoc", version.ref = "coordinatekit-foundation" }
coordinatekit-changelog = { id ="org.coordinatekit.foundation.changelog", version.ref = "coordinatekit-foundation" }
coordinatekit-concordance = { id = "org.coordinatekit.foundation.concordance", version.ref = "coordinatekit-foundation" }
coordinatekit-third-party-licenses = { id = "org.coordinatekit.foundation.third-party-licenses", version.ref = "coordinatekit-foundation" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
sonatype-central-portal-publisher = { id = "net.thebugmc.gradle.sonatype-central-portal-publisher", version.ref = "sonatype-central-portal-publisher" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
